name: Renovate Update dependencies
on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:
  pull_request: # limit this to run on PRs that modify Renovate config files
    paths:
      - ".github/workflows/renovate.yaml"
      - "renovate.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/renovate.yaml"
      - "renovate.json"
# Queues runs against main, which would otherwise update the same Renovate branches at once.
concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  renovate:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          token: ${{ secrets.RENOVATE_GITHUB_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ github.ref_name == 'main' && 'INFO' || 'DEBUG' }}
          RENOVATE_BASE_BRANCHES: main
          # A run from any other branch, including a pull request, reads that branch's config but still
          # targets the real repository; it must not create, update or close branches and PRs.
          RENOVATE_DRY_RUN: ${{ github.ref_name != 'main' && 'full' || '' }}
